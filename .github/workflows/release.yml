name: release

# Push a v* tag, or press "Run workflow" in the Actions tab — both build the
# x86_64 and the aarch64 AppImage on GitHub's machines and attach them to a
# release, so the download links exist without anybody uploading 100 MB by
# hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match VERSION)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against VERSION
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cat VERSION)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match VERSION $version" >&2
            echo "bump VERSION, or tag v$version" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the squashfs tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

      - name: Build both AppImages
        run: ./packaging/build-appimage.sh --arch all

      - name: Checksums
        run: cd dist && sha256sum *.AppImage > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: DarkServe ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          draft: false
          generate_release_notes: true
