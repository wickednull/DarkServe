name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the squashfs tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

      - name: Build both AppImages
        run: ./packaging/build-appimage.sh --arch all

      - name: Checksums
        run: cd dist && sha256sum *.AppImage > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          draft: false
          generate_release_notes: true
